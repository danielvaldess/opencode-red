<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="opencode-red — OpenCode-native offensive security arsenal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- terminal chrome -->
  <rect x="60" y="44" width="1080" height="232" rx="14" fill="#0d1117" fill-opacity="0.82" stroke="#30363d"/>
  <circle cx="88" cy="70" r="6" fill="#ff5f56"/>
  <circle cx="108" cy="70" r="6" fill="#ffbd2e"/>
  <circle cx="128" cy="70" r="6" fill="#27c93f"/>
  <text x="160" y="75" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">opencode-red</text>

  <!-- title -->
  <text x="96" y="160" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" letter-spacing="-2">opencode-red</text>

  <!-- subtitle -->
  <text x="99" y="198" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">OpenCode-native offensive-security arsenal</text>

  <!-- command -->
  <text x="99" y="244" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">$ ./install.sh</text>
  <text x="250" y="244" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">→ 163 skills · 15 commands · deterministic scope gate</text>

  <!-- accent -->
  <rect x="60" y="290" width="1080" height="4" rx="2" fill="url(#accent)"/>
</svg>
