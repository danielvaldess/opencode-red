name: Bug report
description: Report a problem with the installer, commands, engine or docs.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** include secrets, cookies or
        private program details. For a vulnerability in this repository, use a
        private security advisory instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands and output (redact anything sensitive).
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, OpenCode version, Python version, install flags.
      placeholder: |
        OS: Ubuntu 24.04 / WSL2 / macOS 15
        OpenCode: 2.2.6
        Python: 3.12
        Command: ./install.sh --tools
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of ./scripts/verify.sh or the failing command.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a vulnerability disclosure (those go through a private advisory).
          required: true
